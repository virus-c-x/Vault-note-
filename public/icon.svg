<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="vaultPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27272a" stroke-width="3" opacity="0.6" />

  <!-- Outer shield contour -->
  <path d="M 256 70 L 396 122 C 396 268 340 376 256 438 C 172 376 116 268 116 122 Z" 
        fill="url(#vaultPlate)" 
        stroke="url(#shieldGrad)" 
        stroke-width="12" 
        stroke-linejoin="round" />

  <!-- Glowing vault wheel center -->
  <circle cx="256" cy="245" r="76" fill="#18181b" stroke="#8b5cf6" stroke-width="8" filter="url(#glow)" />
  <circle cx="256" cy="245" r="76" fill="#18181b" stroke="#8b5cf6" stroke-width="6" />
  
  <!-- Vault wheel spokes -->
  <line x1="256" y1="185" x2="256" y2="305" stroke="#a5b4fc" stroke-width="5" stroke-linecap="round" />
  <line x1="196" y1="245" x2="316" y2="245" stroke="#a5b4fc" stroke-width="5" stroke-linecap="round" />
  <line x1="213" y1="202" x2="299" y2="288" stroke="#a5b4fc" stroke-width="5" stroke-linecap="round" />
  <line x1="213" y1="288" x2="299" y2="202" stroke="#a5b4fc" stroke-width="5" stroke-linecap="round" />

  <!-- Center Keyhole / Note icon element -->
  <circle cx="256" cy="245" r="28" fill="url(#shieldGrad)" />
  <path d="M 256 230 C 250 230 245 235 245 241 C 245 246 248 249 252 251 L 250 262 L 262 262 L 260 251 C 264 249 267 246 267 241 C 267 235 262 230 256 230 Z" fill="#ffffff" />

  <!-- Decorative security bolts -->
  <circle cx="256" cy="112" r="6" fill="#a5b4fc" />
  <circle cx="360" cy="150" r="6" fill="#a5b4fc" />
  <circle cx="152" cy="150" r="6" fill="#a5b4fc" />
  <circle cx="364" cy="265" r="6" fill="#a5b4fc" />
  <circle cx="148" cy="265" r="6" fill="#a5b4fc" />
  <circle cx="256" cy="395" r="6" fill="#a5b4fc" />
</svg>
